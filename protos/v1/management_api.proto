// lti.gateway.management.v1 — управляющий API шлюза (ADR §5.1, §15).
//
// НАЗНАЧЕНИЕ
//   Контракт описывает административные операции шлюза: управление каналами и их ревизиями,
//   маршрутами продуктов, версиями OpenAPI-контрактов и чтение статуса исходящих операций.
//
// ДОСТУП
//   Один и тот же сервис доступен двумя способами:
//     * gRPC — по полному имени метода, например
//       /lti.gateway.management.v1.ManagementService/ListChannels;
//     * REST — через JSON transcoding по аннотациям google.api.http, указанным у каждого метода.
//   Состав данных и правила ошибок в обоих доступах совпадают.
//
// ИНТЕГРАЦИЯ
//   Каждая операция выполняется в пространстве интеграции: каналы, версии контрактов и маршруты
//   продуктов принадлежат ровно одной интеграции, а объекты других интеграций недоступны.
//     * REST — интеграция входит в путь: /v1/integrations/{integration}/...;
//     * gRPC — интеграция передаётся полем integration в сообщении запроса.
//   Пустое значение поля означает интеграцию по умолчанию (совместимость с вызовами без адресации).
//   Идентификатор интеграции соответствует шаблону ^[a-z][a-z0-9-]{1,31}$.
//
// АУТЕНТИФИКАЦИЯ
//   Каждый метод требует ключ API в заголовке запроса. По умолчанию заголовок X-Management-Api-Key,
//   имя настраивается конфигурацией Management:HeaderName. Отсутствие или неверное значение — отказ
//   без деталей (REST 401, gRPC Unauthenticated). Если ключ не настроен на сервере, весь управляющий
//   API отвечает 503 (gRPC Unavailable).
//
// ОШИБКИ
//   * доменный отказ (валидация, конфликт, неизменяемость) — HTTP 200 / gRPC OK с полем
//     succeeded = false и полным списком problems; активная конфигурация при отказе не меняется;
//   * отсутствие объекта — gRPC NotFound (REST 404), тело проблем не содержит;
//   * некорректный запрос (неразбираемое тело, неизвестный тип авторизации) — gRPC InvalidArgument
//     либо problems с кодом поля;
//   * отказ аутентификации — см. раздел АУТЕНТИФИКАЦИЯ.
//   Поле problems содержит все найденные проблемы за один вызов, а не первую.
//
// СОВМЕСТИМОСТЬ
//   Номера полей не переиспользуются; удалённое поле помечается reserved по номеру и имени;
//   семантика поля не меняется без нового package (v2). Потребитель может генерировать типы из этого
//   файла самостоятельно.
//   Поле integration добавлено как новое (номер 100) и совместимо на уровне protobuf. REST-маршруты
//   изменились несовместимо: в путь добавлен сегмент /v1/integrations/{integration}. Внешних
//   потребителей управляющего API на момент изменения нет, поэтому package lti.gateway.management.v1
//   сохранён; при появлении внешнего потребителя публикуется новая версия package (v2).
//
// СЕКРЕТЫ
//   В сообщениях передаются только ссылки на секреты (config_key), не их значения. Значения
//   секретов сервер не возвращает никогда.

syntax = "proto3";

package lti.gateway.management.v1;

option csharp_namespace = "LtiIntegrationGateway.Contracts.Management.V1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Управляющий API шлюза.
//
// Все методы требуют ключ API в заголовке запроса (см. АУТЕНТИФИКАЦИЯ в шапке файла).
// Доменные отказы возвращаются в поле problems ответа, отсутствие объекта — gRPC NotFound.
service ManagementService {
  // Возвращает все зарегистрированные каналы в порядке имени.
  //
  // Для каждого канала отдаются настройки активной ревизии (если она есть) и перечень всех ревизий
  // с номерами и состояниями. Доменных отказов не бывает: пустой список — валидный результат.
  // REST: GET /v1/integrations/{integration}/outbound-channels
  rpc ListOutboundChannels (ListChannelsRequest) returns (ListChannelsResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/outbound-channels" };
  }

  // Создаёт канал вместе с черновой ревизией с номером 1.
  //
  // Имя канала уникально. Отказ возвращается в problems, если имя занято, не заполнено или настройки
  // ревизии не проходят проверки. Созданный канал не имеет активной ревизии до публикации и активации.
  // REST: POST /v1/integrations/{integration}/outbound-channels
  rpc CreateOutboundChannel (CreateChannelRequest) returns (ChannelOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/outbound-channels" body: "*" };
  }

  // Возвращает канал по имени вместе с активной ревизией и перечнем ревизий.
  //
  // Если канал не найден, возвращается gRPC NotFound (REST 404).
  // REST: GET /v1/integrations/{integration}/outbound-channels/{channel_name}
  rpc GetOutboundChannel (GetChannelRequest) returns (GetChannelResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/outbound-channels/{channel_name}" };
  }

  // Возвращает состояние канала: наличие активной ревизии, признак настроенного секрета, срок
  // действия клиентского сертификата и последние ошибки обмена (ADR §13, §15.2).
  //
  // Отсутствие секрета или непригодный сертификат не являются ошибкой вызова: это диагностическое
  // состояние в ответе (secret_configured = false). Канал без активной ревизии возвращается с
  // состоянием NO_ACTIVE_REVISION и остальной диагностикой. Если канал не найден, возвращается
  // gRPC NotFound (REST 404). Операция только читает данные и фиксируется в аудите управляющих
  // операций; значения секретов, тела сообщений и заголовки в ответ не попадают.
  // REST: GET /v1/integrations/{integration}/outbound-channels/{channel_name}/health
  rpc GetOutboundChannelHealth (GetChannelHealthRequest) returns (GetChannelHealthResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/outbound-channels/{channel_name}/health" };
  }

  // Изменяет настройки черновика канала.
  //
  // Ревизия с номером revision должна быть черновиком: опубликованная ревизия не изменяется, попытка
  // возвращает отказ в problems. Если revision = 0, используется существующий черновик, а при его
  // отсутствии создаётся новый черновик со следующим номером. Активная ревизия не затрагивается.
  // REST: PATCH /v1/integrations/{integration}/outbound-channels/{channel_name}/draft
  rpc UpdateOutboundChannelDraft (UpdateChannelDraftRequest) returns (ChannelOperationResponse) {
    option (google.api.http) = { patch: "/v1/integrations/{integration}/outbound-channels/{channel_name}/draft" body: "*" };
  }
  // Публикует черновик как неизменяемую ревизию.
  //
  // Настройки проверяются полностью; при проблемах возвращается их полный список, а активная ревизия
  // не меняется. Если revision = 0, публикуется текущий черновик.
  // REST: POST /v1/integrations/{integration}/outbound-channels/{channel_name}/revisions/{revision}/publish
  rpc PublishOutboundChannelRevision (PublishChannelRevisionRequest) returns (ChannelOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/outbound-channels/{channel_name}/revisions/{revision}/publish" };
  }

  // Делает опубликованную ревизию активной конфигурацией канала.
  //
  // Предыдущая активная ревизия переходит в состояние Superseded; одновременно активна только одна
  // ревизия канала. Отказ возвращается в problems, если ревизия не опубликована или не найдена.
  // REST: POST /v1/integrations/{integration}/outbound-channels/{channel_name}/revisions/{revision}/activate
  rpc ActivateOutboundChannelRevision (ActivateChannelRevisionRequest) returns (ChannelOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/outbound-channels/{channel_name}/revisions/{revision}/activate" };
  }

  // Возвращает активность предыдущей опубликованной ревизии канала.
  //
  // Используется для отката неудачного изменения конфигурации. Если откатывать некуда, отказ
  // возвращается в problems.
  // REST: POST /v1/integrations/{integration}/outbound-channels/{channel_name}/rollback
  rpc RollbackOutboundChannelRevision (RollbackChannelRevisionRequest) returns (ChannelOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/outbound-channels/{channel_name}/rollback" };
  }

  // Создаёт или полностью заменяет маршрут продукта.
  //
  // Маршрут определяет, к каким каналам продукт имеет доступ и в какие адреса очередей шлюз может
  // доставлять результаты. Пустой список allowed_queue_addresses допустим и означает вычисленный
  // адрес <product_id>.inbox; непустой список должен совпадать с вычисленным адресом, иначе
  // регистрация отклоняется с проблемой address, а существующий маршрут не меняется. Отказ также
  // возвращается в problems, если product_id не соответствует формату или не указан ни один канал.
  // REST: PUT /v1/integrations/{integration}/products/{product_id}/route
  rpc RegisterProductRoute (RegisterProductRouteRequest) returns (OperationResponse) {
    option (google.api.http) = { put: "/v1/integrations/{integration}/products/{product_id}/route" body: "*" };
  }

  // Возвращает маршрут продукта.
  //
  // Если продукт не зарегистрирован, возвращается gRPC NotFound (REST 404).
  // REST: GET /v1/integrations/{integration}/products/{product_id}/route
  rpc GetProductRoute (GetProductRouteRequest) returns (GetProductRouteResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/products/{product_id}/route" };
  }
  // Загружает OpenAPI-документ и создаёт черновик версии контракта канала.
  //
  // Поддерживается OpenAPI 3.0 (принимается как есть) и Swagger 2.0 (конвертируется в 3.0, факт
  // конвертации фиксируется в аудите); OpenAPI 3.1 отклоняется. Проверка fail-closed: запрещённые
  // конструкции, внешние ссылки и поля рядом с $ref дают отказ, неизвестный format — предупреждение.
  // Исходный документ сохраняется без изменений. Проблемы возвращаются в problems, предупреждения —
  // в warnings.
  // REST: POST /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts
  rpc UploadInboundContractVersion (UploadContractRequest) returns (ContractOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts" body: "*" };
  }

  // Публикует версию контракта и фиксирует её операции.
  //
  // Из документа извлекаются операции (HTTP-метод, шаблон пути, operationId). Публикация отклоняется
  // при повторяющемся operationId и при конфликте «метод + шаблон» с активными маршрутами других
  // каналов. Опубликованная версия неизменяема: повторная публикация возвращает отказ.
  // REST: POST /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/publish
  rpc PublishInboundContractVersion (PublishContractVersionRequest) returns (ContractOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/publish" };
  }

  // Активирует опубликованную версию контракта.
  //
  // Маршруты версии регистрируются в каталоге входящих маршрутов и начинают обслуживаться без
  // перезапуска приложения; маршруты предыдущей активной версии канала снимаются. Если активация
  // отклонена, ранее активные маршруты продолжают работать.
  // REST: POST /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/activate
  rpc ActivateInboundContractVersion (ActivateContractVersionRequest) returns (ContractOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/activate" };
  }

  // Возвращает операции версии контракта с настройками приёма.
  //
  // Для каждой операции отдаются HTTP-метод, шаблон пути, operationId (пустая строка, если в
  // документе он не задан) и настройки операции: enabled и recipient_queue. Отсутствие
  // переопределения очереди выражается пустой строкой. Если версия не найдена, возвращается gRPC
  // NotFound.
  // REST: GET /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/operations
  rpc ListInboundContractOperations (ListContractOperationsRequest) returns (ListContractOperationsResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/operations" };
  }

  // Возвращает версию контракта с настройками входящих вызовов и перечнем операций.
  //
  // Настройки включают очередь получателя, тип авторизации с несекретными параметрами и квоту
  // частоты; значение секрета не возвращается. Если версия не найдена, возвращается gRPC NotFound.
  // REST: GET /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}
  rpc GetInboundContractVersion (GetContractVersionRequest) returns (GetContractVersionResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}" };
  }

  // Изменяет настройки входящих вызовов версии контракта.
  //
  // Изменение допускается только для версии в состоянии черновика: опубликованная версия
  // неизменяема. Очередь получателя обязательна для публикации, но не для сохранения черновика.
  // Отказы возвращаются в problems с кодами version, auth_type, config_key, user_name, rate_limit.
  // REST: PATCH /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/settings
  rpc UpdateInboundContractVersionSettings (UpdateContractVersionSettingsRequest) returns (ContractOperationResponse) {
    option (google.api.http) = { patch: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/settings" body: "*" };
  }

  // Изменяет настройки одной операции версии контракта: признак обслуживания и очередь получателя.
  //
  // Передаются только изменяемые поля: отсутствующее поле остаётся без изменений. Операции
  // извлекаются из документа при публикации, поэтому настройки задаются для опубликованной версии;
  // для черновика операций ещё нет и запрос возвращает gRPC NotFound (REST 404). Изменение
  // отменённой версии (superseded) отклоняется с проблемой version, неизвестная операция или
  // операция без operationId в документе — gRPC NotFound (REST 404), пустой набор полей — проблема
  // settings, пустой path-параметр operation_id — проблема operation_id. Для активной версии
  // изменение применяется к работающим маршрутам без перезапуска; при отказе каталога маршрутов
  // действует прежний набор. Операция фиксируется в аудите управляющих операций.
  // REST: PATCH /v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/operations/{operation_id}
  rpc UpdateInboundContractOperationSettings (UpdateContractOperationSettingsRequest) returns (ContractOperationResponse) {
    option (google.api.http) = { patch: "/v1/integrations/{integration}/inbound-channels/{channel_name}/contracts/{version}/operations/{operation_id}" body: "*" };
  }

  // Возвращает все входящие каналы в порядке имени.
  //
  // Доменных отказов не бывает: пустой список — валидный результат.
  // REST: GET /v1/integrations/{integration}/inbound-channels
  rpc ListInboundChannels (ListInboundChannelsRequest) returns (ListInboundChannelsResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/inbound-channels" };
  }

  // Создаёт входящий канал вместе с черновиком первой версии OpenAPI-контракта.
  //
  // Имя уникально только среди входящих каналов; outbound-канал с таким же именем допустим.
  // Документ обязателен и проверяется при создании. response_mode по умолчанию ASYNC,
  // inbound_response_timeout_ms — 30000. Публикация и активация контракта выполняются отдельно.
  // REST: POST /v1/integrations/{integration}/inbound-channels
  rpc CreateInboundChannel (CreateInboundChannelRequest) returns (InboundChannelOperationResponse) {
    option (google.api.http) = { post: "/v1/integrations/{integration}/inbound-channels" body: "*" };
  }

  // Возвращает входящий канал с настройками режима и перечнем версий контракта.
  //
  // Если канал не найден, возвращается gRPC NotFound (REST 404).
  // REST: GET /v1/integrations/{integration}/inbound-channels/{channel_name}
  rpc GetInboundChannel (GetInboundChannelRequest) returns (GetInboundChannelResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/inbound-channels/{channel_name}" };
  }

  // Возвращает диагностическое состояние входящего канала: настройки, активный контракт и
  // последние ошибки приёма. Значения секретов и тела сообщений не возвращаются.
  // REST: GET /v1/integrations/{integration}/inbound-channels/{channel_name}/health
  rpc GetInboundChannelHealth (GetInboundChannelHealthRequest) returns (GetInboundChannelHealthResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/inbound-channels/{channel_name}/health" };
  }

  // Изменяет channel-level настройки входящего канала с аудитом.
  //
  // Передаются только изменяемые поля; отсутствующее поле остаётся без изменений. Новые значения
  // применяются к последующим вызовам; уже начатые ожидания используют прежний snapshot.
  // REST: PATCH /v1/integrations/{integration}/inbound-channels/{channel_name}/settings
  rpc UpdateInboundChannelSettings (UpdateInboundChannelSettingsRequest) returns (InboundChannelOperationResponse) {
    option (google.api.http) = { patch: "/v1/integrations/{integration}/inbound-channels/{channel_name}/settings" body: "*" };
  }


  //
  // Отдаются состояние, исход, HTTP-статус, код ошибки, число попыток и адрес доставки результата.
  // Если операция не найдена, возвращается gRPC NotFound (REST 404).
  // REST: GET /v1/integrations/{integration}/operations/{message_id}
  rpc GetOutboundOperation (GetOutboundOperationRequest) returns (GetOutboundOperationResponse) {
    option (google.api.http) = { get: "/v1/integrations/{integration}/operations/{message_id}" };
  }

  // Возвращает все интеграции, для которых существует конфигурация, в порядке идентификатора.
  //
  // Запись интеграции создаётся при первой изменяющей операции над её ресурсами, поэтому список
  // отражает настроенные интеграции; развёрнутые, но ещё не настроенные интеграции в него не
  // попадают. Доменных отказов не бывает: пустой список — валидный результат.
  // REST: GET /v1/integrations
  rpc ListIntegrations (ListIntegrationsRequest) returns (ListIntegrationsResponse) {
    option (google.api.http) = { get: "/v1/integrations" };
  }
}

// Проблема доменной проверки: код и безопасное описание без внутренних деталей конфигурации.
// Возвращается в поле problems ответа; пустой список проблем означает успех операции.
// Серьёзность проблемы: ошибка блокирует операцию, предупреждение — нет.
enum ProblemSeverity {
  // Значение не задано; для совместимости трактуется как ошибка.
  PROBLEM_SEVERITY_UNSPECIFIED = 0;

  // Отказ: операция не выполнена.
  PROBLEM_SEVERITY_ERROR = 1;

  // Предупреждение: операция выполнена, но есть замечание.
  PROBLEM_SEVERITY_WARNING = 2;
}

// Проблема доменной проверки: код, безопасное описание и серьёзность; используется в problems.
message OperationProblem {
  // Код проблемы — префикс исходного сообщения проверки: channel, name, base_url,
  // retry_policy, config_key, auth_type, settings, revision, version, path, method,
  // template, schema, ref, format, operation_id, conflict, operation, queue, address, rate_limit.
  // Устойчивый признак для программной обработки; текст проблемы может уточняться без смены
  // контракта.
  string code = 1;

  // Человекочитаемое описание проблемы без значений секретов и без имён внутренних сущностей.
  string message = 2;

  // Серьёзность: ERROR — операция отклонена, WARNING — выполнена с замечанием.
  ProblemSeverity severity = 3;
}

// Правило политики повторов исходящего вызова.
// Политика канала — упорядоченный список правил: первое подходящее правило задаёт задержки.
message RetryRule {
  // Признак совпадения: http_status_in — ответ с одним из status_codes, transport_error —
  // отсутствие ответа (таймаут, отказ соединения, ошибка TLS). Другие значения отклоняются.
  string match = 1;

  // HTTP-статусы для match = http_status_in, например 429, 503. Для transport_error не задаются.
  repeated int32 status_codes = 2;

  // Задержки перед повторами в миллисекундах: число повторов равно длине списка, значения положительные.
  repeated int32 delays_ms = 3;
}

// Настройки канала, фиксируемые ревизией. Опубликованная ревизия неизменяема.
message ChannelSettings {
  // Базовый URL внешней системы: абсолютный адрес со схемой https, без учётных данных и без
  // завершающего пути, например https://bank-a.example.
  string base_url = 1;

  // Тип авторизации: none, bearer, api_key, basic или client_certificate. Значение секрета
  // (токен, пароль, материал клиентского сертификата) в базе и в ответах API не хранится:
  // задаётся только ключ конфигурации, по которому рантайм берёт секрет из окружения.
  string auth_type = 2;

  // Ключ конфигурации, по которому рантайм берёт значение секрета (например Secrets:BankA:Token).
  // Сам секрет в базе и в API не хранится и не возвращается.
  string config_key = 3;

  // Имя заголовка для auth_type = api_key. Пустое значение означает передачу ключа
  // query-параметром api_key.
  string header_name = 4;

  // Имя пользователя для auth_type = basic; для остальных типов не используется.
  string user_name = 5;

  // Таймаут одной попытки вызова в миллисекундах, положительное значение.
  int32 per_attempt_timeout_ms = 6;

  // Общий предел длительности вызова со всеми повторами в миллисекундах; не меньше таймаута попытки.
  int32 overall_cap_ms = 7;

  // Политика повторов; требуется хотя бы одно правило.
  repeated RetryRule retry_policy = 8;
}

// Краткая информация о ревизии канала: номер и состояние.
message ChannelRevisionInfo {
  // Номер ревизии внутри канала, начиная с 1; возрастает при каждом новом черновике.
  int32 number = 1;

  // Состояние ревизии: Draft, Published, Active или Superseded. Активной может быть только одна
  // ревизия канала.
  string status = 2;
}

// Канал интеграции с активной конфигурацией и перечнем ревизий.
message ChannelInfo {
  // Идентификатор канала (Guid в строковом виде); используется во всех операциях над каналом.
  string channel_id = 1;

  // Уникальное имя канала в формате ^[a-z][a-z0-9-]{1,31}$, например bank-a.
  string name = 2;

  // Настройки активной ревизии. Поле отсутствует, если активной ревизии ещё нет: канал создан, но
  // конфигурация не опубликована и не активирована.
  ChannelSettings active_settings = 3;

  // Все ревизии канала в порядке возрастания номера.
  repeated ChannelRevisionInfo revisions = 4;
}

// Запрос списка каналов. Параметров не требует: список всегда возвращается полностью.
message ListChannelsRequest {

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Ответ со списком каналов, упорядоченным по имени.
message ListChannelsResponse {
  // Каналы шлюза; пустой список означает, что каналы ещё не созданы.
  repeated ChannelInfo channels = 1;
}

// Запрос создания канала вместе с черновой ревизией номер 1.
message CreateChannelRequest {
  // Уникальное имя создаваемого канала, формат ^[a-z][a-z0-9-]{1,31}$. Занятое имя — отказ.
  string name = 1;

  // Начальные настройки черновика; проверяются при публикации, но формат полей проверяется сразу.
  ChannelSettings settings = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос канала по имени.
message GetChannelRequest {
  // Имя существующего канала; отсутствие канала — gRPC NotFound.
  string channel_name = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Ответ с данными одного канала.
message GetChannelResponse {
  // Канал с активными настройками и перечнем ревизий.
  ChannelInfo channel = 1;
}

// Режим ответа входящего канала.
enum InboundResponseMode {
  // Значение не задано; в запросе создания трактуется как ASYNC.
  INBOUND_RESPONSE_MODE_UNSPECIFIED = 0;

  // Шлюз отвечает 202 после передачи сообщения и не ждёт ответа продукта.
  INBOUND_RESPONSE_MODE_ASYNC = 1;

  // Шлюз ожидает InboundResponse и возвращает ответ продукта внешнему клиенту.
  INBOUND_RESPONSE_MODE_SYNC = 2;
}

// Настройки входящего канала, действующие для всех его endpoints.
message InboundChannelSettings {
  // Режим ответа; в ответе всегда ASYNC или SYNC.
  InboundResponseMode response_mode = 1;

  // Таймаут ожидания InboundResponse в миллисекундах; положительное значение.
  int32 inbound_response_timeout_ms = 2;
}

// Краткая информация о версии контракта входящего канала.
message InboundContractVersionInfo {
  // Номер версии внутри канала, начиная с 1.
  int32 version = 1;

  // Состояние версии: Draft, Published, Active или Superseded.
  string status = 2;
}

// Входящий канал с настройками режима и перечнем версий контракта.
message InboundChannelInfo {
  // Идентификатор канала (Guid в строковом виде).
  string channel_id = 1;

  // Уникальное имя канала в пределах inbound-направления.
  string name = 2;

  // Настройки режима ответа и таймаута, действующие для канала.
  InboundChannelSettings settings = 3;

  // Номер активной версии контракта; 0 означает, что активной версии нет.
  int32 active_contract_version = 4;

  // Все версии контракта в порядке возрастания номера.
  repeated InboundContractVersionInfo contract_versions = 5;
}

// Запрос списка входящих каналов. Параметров не требует.
message ListInboundChannelsRequest {

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Ответ со списком входящих каналов, упорядоченным по имени.
message ListInboundChannelsResponse {
  // Входящие каналы; пустой список означает, что каналы ещё не созданы.
  repeated InboundChannelInfo channels = 1;
}

// Запрос создания входящего канала с первым черновиком контракта.
message CreateInboundChannelRequest {
  // Уникальное имя входящего канала; имя outbound-канала не конфликтует с ним.
  string name = 1;

  // Обязательный документ OpenAPI/Swagger; проверяется до сохранения.
  string document = 2;

  // Режим ответа; отсутствие поля означает ASYNC.
  optional InboundResponseMode response_mode = 3;

  // Таймаут ожидания ответа в миллисекундах; отсутствие поля означает 30000.
  optional int32 inbound_response_timeout_ms = 4;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Результат операции над входящим каналом.
message InboundChannelOperationResponse {
  // Признак успеха операции.
  bool succeeded = 1;

  // Полный список проблем; пустой при успехе.
  repeated OperationProblem problems = 2;

  // Идентификатор канала; пустая строка, если канал не создан.
  string channel_id = 3;

  // Номер созданной или изменённой версии контракта; 0, если операция не затрагивает версию.
  int32 contract_version = 4;
}

// Запрос входящего канала по имени.
message GetInboundChannelRequest {
  // Имя существующего входящего канала; отсутствие — gRPC NotFound.
  string channel_name = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Ответ с данными входящего канала.
message GetInboundChannelResponse {
  // Входящий канал с настройками и версиями контракта.
  InboundChannelInfo channel = 1;
}

// Запрос состояния входящего канала.
message GetInboundChannelHealthRequest {
  // Имя существующего входящего канала; отсутствие — gRPC NotFound.
  string channel_name = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Состояние входящего канала: активный контракт и последние ошибки приёма.
message GetInboundChannelHealthResponse {
  // Имя канала; совпадает с channel_name запроса.
  string channel_name = 1;

  // Состояние: ACTIVE — активный контракт есть, NO_ACTIVE_CONTRACT — активного контракта нет.
  string state = 2;

  // Номер активной версии контракта; 0, если активной версии нет.
  int32 active_contract_version = 3;

  // Последние ошибки приёма, не более пяти, от новых к старым; тела и заголовки не возвращаются.
  repeated ChannelHealthError errors = 4;

  // Момент формирования ответа в UTC.
  google.protobuf.Timestamp checked_at = 5;
}

// Запрос изменения channel-level настроек входящего канала.
message UpdateInboundChannelSettingsRequest {
  // Имя изменяемого входящего канала.
  string channel_name = 1;

  // Новый режим ответа; отсутствие поля означает сохранение текущего.
  optional InboundResponseMode response_mode = 2;

  // Новый таймаут в миллисекундах; отсутствие поля означает сохранение текущего.
  optional int32 inbound_response_timeout_ms = 3;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}


// Запрос состояния канала.
message GetChannelHealthRequest {
  // Имя существующего канала; незарегистрированное имя — gRPC NotFound (REST 404).
  // Пустая строка трактуется как неизвестный канал.
  string channel_name = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Состояние канала: активная ревизия, настройка секрета, срок сертификата и последние ошибки.
// Заполняется шлюзом; потребитель только читает поля.
message GetChannelHealthResponse {
  // Имя канала, для которого построено состояние; совпадает с channel_name запроса.
  string channel_name = 1;

  // Состояние канала: ACTIVE — активная ревизия есть, NO_ACTIVE_REVISION — активной ревизии нет.
  // Пустая строка не возвращается: одно из двух значений заполнено всегда.
  string state = 2;

  // Номер активной ревизии; 0 означает, что активной ревизии нет (тогда state = NO_ACTIVE_REVISION).
  int32 active_revision = 3;

  // Признак обеспеченности активной ревизии секретом: true — тип авторизации none (секрет не
  // требуется) либо материал по ключу конфигурации найден и пригоден к использованию; false — активной
  // ревизии нет, config_key пуст для типа, требующего секрет, значение по ключу отсутствует, либо
  // клиентский сертификат не разбирается, не имеет приватного ключа, истёк или ещё не вступил в силу.
  bool secret_configured = 4;

  // Имя ключа конфигурации, по которому активная ревизия читает секрет или клиентский сертификат;
  // пустая строка — ключ не задан или активной ревизии нет. Значение секрета не возвращается никогда.
  string secret_config_key = 5;

  // Срок действия клиентского сертификата активной ревизии в UTC. Заполняется и для непригодного
  // сертификата (истёкшего или ещё не вступившего в силу), если материал разбирается; отсутствует,
  // если тип авторизации не client_certificate, активной ревизии нет или материал не разбирается.
  google.protobuf.Timestamp certificate_expires_at = 6;

  // Последние ошибки обмена по каналу: не более пяти записей на направление, от новых к старым.
  // Тела сообщений, заголовки и тексты ошибок в ответ не попадают.
  repeated ChannelHealthError errors = 7;

  // Момент формирования ответа в UTC; используется для оценки актуальности данных.
  google.protobuf.Timestamp checked_at = 8;

  // Действующая версия конфигурации интеграции, которой принадлежит канал; 0 — интеграция ещё не
  // менялась. Сравнивается с applied_version экземпляров для оценки отставания применения.
  int64 configuration_version = 9;

  // Отчёты экземпляров сервиса потоков этой интеграции, упорядоченные по instance_id. Пустой список
  // означает, что ни один экземпляр ещё не отчитался.
  repeated FlowInstanceState flow_instances = 10;
}

// Применённое состояние экземпляра сервиса потоков: версия конфигурации, время отчёта и признаки
// расхождения с действующей конфигурацией и устаревания отчёта.
message FlowInstanceState {
  // Идентификатор экземпляра (пода) внутри интеграции; непустая строка.
  string instance_id = 1;

  // Применённая экземпляром версия конфигурации; 0 — экземпляр ещё не применял конфигурацию.
  int64 applied_version = 2;

  // Признак актуальности: true — applied_version не меньше configuration_version канала.
  bool up_to_date = 3;

  // Признак устаревшего отчёта: true — отчёт получен более 15 секунд назад. Устаревший отчёт не
  // позволяет судить о текущем состоянии экземпляра.
  bool stale = 4;

  // Момент последнего отчёта экземпляра в UTC.
  google.protobuf.Timestamp reported_at = 5;

  // Признак обеспеченности активной конфигурации интеграции секретами на момент отчёта.
  bool secret_configured = 6;

  // Ближайший срок действия клиентского сертификата активной конфигурации интеграции; отсутствует,
  // если сертификаты не используются.
  google.protobuf.Timestamp certificate_expires_at = 7;

  // Текст последней ошибки применения конфигурации; пустая строка — последнее применение успешно.
  // Значения секретов и тела сообщений в текст не попадают.
  string apply_error = 8;
}

// Ошибка обмена по каналу для диагностики: без тел сообщений, заголовков и значений секретов.
message ChannelHealthError {
  // Момент возникновения ошибки в UTC: время создания исходящей записи журнала или время приёма
  // входящего вызова.
  google.protobuf.Timestamp occurred_at = 1;

  // Направление обмена: outbound — исходящий вызов внешней системы, inbound — входящий вызов
  // шлюза. Пустая строка не возвращается.
  string direction = 2;

  // Код ошибки из журнала; пустая строка не возвращается, потому что записи без кода в выборку не
  // попадают. Множество кодов не закрыто и зависит от направления. Для исходящих (direction =
  // outbound) это коды OutboundErrorCodes: PRODUCT_NOT_ALLOWED, CHANNEL_NOT_ALLOWED,
  // CHANNEL_NOT_ACTIVE, METHOD_NOT_ALLOWED, PATH_NOT_ALLOWED, SECRET_NOT_CONFIGURED,
  // AUTH_TYPE_UNSUPPORTED, TIMEOUT, CONNECTION_FAILED, TLS_FAILED, RETRIES_EXHAUSTED. Для входящих
  // (direction = inbound) — префикс кода журнала приёма до двоеточия (auth, body, schema,
  // content_type, query, queue) либо код delivery для сбоя передачи в очередь.
  string error_code = 3;

  // HTTP-статус ответа внешней системы для исходящей ошибки; 0 означает, что статуса нет, либо
  // ошибка входящая.
  int32 http_status = 4;

  // Исход исходящей операции, например HTTP_RESPONSE, TRANSPORT_ERROR или GATEWAY_REFUSED;
  // пустая строка для входящих ошибок.
  string outcome = 5;
}

// Запрос изменения настроек черновика.
message UpdateChannelDraftRequest {
  // Имя канала, черновик которого изменяется.
  string channel_name = 1;

  // Номер изменяемого черновика. 0 означает: взять существующий черновик, а при его отсутствии
  // создать новый со следующим номером. Опубликованная ревизия не изменяется.
  int32 revision = 2;

  // Полный набор настроек черновика: отсутствующие поля сбрасываются к значениям по умолчанию.
  ChannelSettings settings = 3;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос публикации ревизии канала.
message PublishChannelRevisionRequest {
  // Имя канала, чей черновик публикуется.
  string channel_name = 1;

  // Номер публикуемого черновика; 0 означает текущий черновик. Опубликованная ревизия повторно
  // не публикуется — операция вернёт отказ.
  int32 revision = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос активации опубликованной ревизии канала.
message ActivateChannelRevisionRequest {
  // Имя канала, чья ревизия активируется.
  string channel_name = 1;

  // Номер активируемой ревизии; ревизия должна быть опубликована.
  int32 revision = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос отката конфигурации канала на предыдущую опубликованную ревизию.
message RollbackChannelRevisionRequest {
  // Имя канала, конфигурация которого откатывается.
  string channel_name = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Результат операции над каналом или ревизией.
message ChannelOperationResponse {
  // Признак успеха: true — операция выполнена, false — отказ, подробности в problems.
  bool succeeded = 1;

  // Полный список проблем проверки или конфликтов; пустой при succeeded = true.
  repeated OperationProblem problems = 2;

  // Идентификатор канала в строковом виде; заполняется, когда операция относится к конкретному каналу.
  string channel_id = 3;

  // Номер ревизии, затронутой операцией: черновика — при создании и изменении, опубликованной или
  // активной — при публикации, активации и откате. 0 означает, что номер не определён.
  int32 revision = 4;
}

// Результат операции без доменных данных.
message OperationResponse {
  // Признак успеха: true — операция выполнена, false — отказ, подробности в problems.
  bool succeeded = 1;

  // Полный список проблем проверки или конфликтов; пустой при succeeded = true.
  repeated OperationProblem problems = 2;
}

// Запрос создания или замены маршрута продукта.
message RegisterProductRouteRequest {
  // Идентификатор продукта, формат ^[a-z][a-z0-9-]{1,31}$, например dpv.
  string product_id = 1;

  // Каналы, доступные продукту для исходящих вызовов. Требуется хотя бы один.
  repeated string allowed_channels = 2;

  // Адреса очередей продукта. Пустой список допустим: сохраняется вычисленный адрес
  // <product_id>.inbox. Непустой список должен совпадать с вычисленным адресом, иначе регистрация
  // отклоняется с проблемой address, а существующий маршрут не меняется.
  repeated string allowed_queue_addresses = 3;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос маршрута продукта.
message GetProductRouteRequest {
  // Идентификатор зарегистрированного продукта; отсутствие — gRPC NotFound.
  string product_id = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Ответ с маршрутом продукта.
message GetProductRouteResponse {
  // Идентификатор продукта.
  string product_id = 1;

  // Каналы, доступные продукту.
  repeated string allowed_channels = 2;

  // Адрес очереди продукта, вычисленный из product_id: <product_id>.inbox (список из одного
  // элемента). Сохранённое в маршруте значение источником истины не является и не возвращается.
  repeated string allowed_queue_addresses = 3;
}

// Запрос загрузки OpenAPI-документа как черновика версии контракта канала.
message UploadContractRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Исходный документ OpenAPI 3.0 или Swagger 2.0 в виде текста (JSON или YAML).
  // Сохраняется без изменений; версия определяется по полям openapi или swagger.
  string document = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос публикации версии контракта.
message PublishContractVersionRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Номер публикуемой версии; версия должна быть черновиком.
  int32 version = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос активации опубликованной версии контракта.
message ActivateContractVersionRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Номер активируемой версии; версия должна быть опубликована.
  int32 version = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос операций версии контракта.
message ListContractOperationsRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Номер версии контракта; отсутствие версии — gRPC NotFound.
  int32 version = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Операция версии контракта: метод, шаблон пути, идентификатор операции из документа и настройки
// операции. Настройки — изменяемый слой поверх неизменяемого документа версии (ADR §7.3).
message ContractOperationInfo {
  // HTTP-метод операции в верхнем регистре: GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD или TRACE.
  string http_method = 1;

  // Шаблон пути из документа, например /callbacks/contracts/{id}; на его основе регистрируется
  // входящий маршрут при активации версии.
  string template = 2;

  // Идентификатор операции из документа; пустая строка, если operationId не задан.
  string operation_id = 3;

  // Признак обслуживания операции: false — вызовы получают 404 и фиксируются в аудите.
  bool enabled = 4;

  // Переопределение очереди получателя продукта в формате <product_id>.inbox; пустая строка
  // означает, что действует очередь версии.
  string recipient_queue = 5;
}

// Ответ с операциями версии контракта, упорядоченными по методу и шаблону.
message ListContractOperationsResponse {
  // Операции версии контракта; пустой список допустим для документа без путей.
  repeated ContractOperationInfo operations = 1;
}

// Запрос версии контракта канала.
message GetContractVersionRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Номер версии контракта; отсутствие версии — gRPC NotFound.
  int32 version = 2;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Настройки входящих вызовов версии контракта.
message ContractVersionSettings {
  // Очередь получателя продуктов в формате <product_id>.inbox; обязательна при публикации версии.
  // Несоответствие формату отклоняет публикацию с проблемой queue.
  string recipient_queue = 1;

  // Тип авторизации входящих вызовов: none, api_key, basic, client_certificate.
  string auth_type = 2;

  // Ключ конфигурации, из которого берётся значение секрета; обязателен для api_key, basic
  // и client_certificate. Значение секрета в базе и в ответах отсутствует.
  string config_key = 3;

  // Имя заголовка для типа api_key; пустое значение означает заголовок X-Api-Key.
  string header_name = 4;

  // Имя пользователя для типа basic.
  string user_name = 5;

  // Квота запросов на окно; 0 — используется общая квота приложения.
  int32 rate_limit_permit = 6;

  // Окно квоты в секундах; 0 — используется общее окно приложения.
  int32 rate_limit_window_seconds = 7;
}

// Ответ с версией контракта.
message GetContractVersionResponse {
  // Номер версии.
  int32 version = 1;

  // Состояние версии: Draft, Published, Active или Superseded.
  string status = 2;

  // Настройки входящих вызовов версии.
  ContractVersionSettings settings = 3;

  // Операции версии контракта.
  repeated ContractOperationInfo operations = 4;
}

// Запрос изменения настроек входящих вызовов версии контракта.
message UpdateContractVersionSettingsRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Номер версии; изменение допускается только для черновика.
  int32 version = 2;

  // Новые настройки: отсутствующие значения сбрасываются в значения по умолчанию.
  ContractVersionSettings settings = 3;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Запрос изменения настроек одной операции версии контракта.
//
// Передаются только изменяемые поля: отсутствующее поле остаётся без изменений, поэтому изменение
// одной настройки не затрагивает остальные. Настройки задаются для версии, в которой уже извлечены
// операции (после публикации); для черновика операций нет и запрос возвращает NotFound. Изменение
// отменённой версии (superseded) отклоняется с проблемой version.
message UpdateContractOperationSettingsRequest {
  // Имя канала, которому принадлежит контракт.
  string channel_name = 1;

  // Номер версии контракта; неизвестная версия — gRPC NotFound (REST 404).
  int32 version = 2;

  // Операция из документа по operationId; обязательна для адресации настроек. Операции без
  // operationId в документе управляющим API не адресуются; для черновика, неизвестного
  // идентификатора и такой операции — gRPC NotFound (REST 404). Пустой path-параметр — проблема
  // operation_id.
  string operation_id = 3;

  // Признак обслуживания операции; отсутствие поля — значение не меняется.
  optional bool enabled = 4;

  // Переопределение очереди получателя продукта в формате <product_id>.inbox; отсутствие поля —
  // значение не меняется, пустая строка снимает переопределение и возвращает очередь версии,
  // несоответствие формату отклоняется с проблемой queue.
  optional string recipient_queue = 5;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Результат операции над версией контракта.
message ContractOperationResponse {
  // Признак успеха: true — операция выполнена, false — отказ, подробности в problems.
  bool succeeded = 1;

  // Полный список проблем проверки документа, конфликтов и нарушений неизменяемости; проблемы с
  // severity = WARNING не препятствуют операции.
  repeated OperationProblem problems = 2;

  // Номер версии контракта, созданной или затронутой операцией; 0, если номер не определён.
  int32 version = 4;

  // Формат исходного документа: OpenApi30 или Swagger20. Заполняется при загрузке документа.
  string source_format = 5;
}

// Запрос состояния исходящей операции.
message GetOutboundOperationRequest {
  // Идентификатор операции из сообщения OutboundRequest; отсутствие — gRPC NotFound.
  string message_id = 1;

  // Интеграция, в пространстве которой выполняется операция. Пустое значение означает
  // интеграцию по умолчанию, с которой работает шлюз без явной адресации.
  string integration = 100;
}

// Состояние исходящей операции, зафиксированное шлюзом.
message GetOutboundOperationResponse {
  // Идентификатор операции из исходного сообщения.
  string message_id = 1;

  // Идентификатор продукта, отправившего запрос.
  string product_id = 2;

  // Имя канала, по конфигурации которого выполнялся вызов.
  string channel_name = 3;

  // Состояние операции: Accepted, InProgress или Completed.
  string status = 4;

  // Исход завершённой операции: HTTP_RESPONSE, TRANSPORT_ERROR или GATEWAY_REFUSED; пусто, пока
  // операция не завершена.
  string outcome = 5;

  // HTTP-статус ответа внешней системы; 0, если ответ не получен или операция отклонена шлюзом.
  int32 http_status_code = 6;

  // Код отказа шлюза или транспортной ошибки, например PRODUCT_NOT_ALLOWED или TIMEOUT;
  // пусто при успешном ответе внешней системы.
  string error_code = 7;

  // Количество выполненных попыток вызова, включая первую.
  int32 attempt_count = 8;

  // Адрес очереди, в которую доставляется результат; пусто, если адрес не определён.
  string return_address = 9;
}

// Запрос списка интеграций. Параметров не требует: интеграция — ресурс верхнего уровня, поэтому
// scope-поля в запросе нет.
message ListIntegrationsRequest {}

// Интеграция с версией действующей конфигурации и временем появления записи.
message IntegrationInfo {
  // Идентификатор интеграции в формате ^[a-z][a-z0-9-]{1,31}$; он же имя интеграции.
  string integration = 1;

  // Версия действующей конфигурации интеграции; 0 — конфигурация ещё не менялась.
  int64 configuration_version = 2;

  // Момент появления записи интеграции в UTC.
  google.protobuf.Timestamp created_at = 3;
}

// Ответ со списком интеграций, упорядоченным по идентификатору.
message ListIntegrationsResponse {
  // Интеграции, для которых существует конфигурация; пустой список означает, что настроенных
  // интеграций нет.
  repeated IntegrationInfo integrations = 1;
}

