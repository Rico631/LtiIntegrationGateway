schema: spec-driven

context: |
  Проект: LtiIntegrationGateway — самостоятельное приложение для интеграции продуктов LTI с внешними системами.

  Язык и формат:
  - OpenSpec artifacts (proposal, specs, design, tasks) пишутся на русском языке.
  - Имена типов, методов, свойств, переменных, файлов исходного кода и технических идентификаторов сохраняются на английском языке.
  - Используй конкретные формулировки, проверяемые требования и однозначные критерии приёмки.
  - Не придумывай неизвестные бизнес-правила, внешние API, настройки эксплуатации или гарантии библиотек. Явно фиксируй открытые вопросы и допущения.

  Технологии:
  - .NET 10, C#.
  - Один производственный проект LtiIntegrationGateway; весь production-код находится в нём.
  - Единственный отдельный тестовый проект: LtiIntegrationGateway.Tests.
  - TUnit и необходимые дополнительные модули для тестирования.
  - EF Core; начальное хранилище — SQLite. Для интеграционных тестов использовать SQLite in-memory с открытым соединением на время теста, если нужно сохранять состояние между операциями.
  - Protobuf contract-first. gRPC-сервисы и сообщения Rebus объявляются в .proto; C#-типы генерируются из контрактов и не дублируются вручную.
  - gRPC JSON transcoding предоставляет REST-доступ к статическим gRPC API.
  - Rebus; начальная конфигурация транспорта — in-memory.
  - DistributedLock для сценариев, где нужна координация конкурентных операций. Конкретный production provider определяется отдельно.

  Архитектура и структура:
  - Применяй Feature-first и Vertical Slice Architecture внутри одного производственного проекта.
  - Организуй код вокруг функциональных сценариев. Не создавай отдельные проекты Domain, Application, Infrastructure или ManagementApi.
  - Не добавляй новые производственные проекты без явного изменения архитектурного решения.
  - Создавай общие абстракции только при наличии реальной повторяемости или необходимости изолировать инфраструктурную зависимость.
  - LtiIntegrationGateway — самостоятельное решение и не зависит от сборок продуктов ЛК, ДПВ или других потребителей. Общение с ними идёт по опубликованным контрактам.

  Назначение и интеграционные потоки:
  - Продукты и шлюз обмениваются сообщениями через Rebus; результаты исходящих HTTP-вызовов также возвращаются через Rebus.
  - Outbound: продукт задаёт ChannelName, RelativePath, HTTP-метод, тело и необходимые корреляционные/идемпотентные идентификаторы. Шлюз выбирает BaseUrl и авторизацию из конфигурации канала и выполняет HTTP-вызов. Для outbound OpenAPI-контракт в шлюзе не требуется; бизнес-маппинг не выполняется.
  - Inbound: внешний сервис вызывает динамический HTTP endpoint. Шлюз использует OpenAPI/Swagger JSON, загруженный и версионируемый в хранилище, чтобы определить операцию и валидировать запрос. Сообщение Rebus должно содержать как минимум фактические HTTP-метод и относительный путь, а также шаблон маршрута/OperationId, если доступны, и исходное JSON-тело.
  - gRPC JSON transcoding относится к статическим API, описанным в .proto, и сам по себе не создаёт динамические endpoint-ы из Swagger. Динамические inbound endpoint-ы реализуются отдельно средствами ASP.NET Core.
  - Не передавай секреты, токены и произвольные абсолютные URL в сообщениях Rebus. Ограничивай доступ продуктов к каналам, путям и очередям доверенной конфигурацией.

  Хранение и надёжность:
  - Конфигурация каналов, контрактов и их ревизий хранится через EF Core; начальная база — SQLite.
  - Опубликованные ревизии контрактов и конфигурации считаются неизменяемыми. Изменения валидируются и активируются без пересборки и перезапуска приложения.
  - In-memory Rebus и SQLite in-memory предназначены для начальной разработки и тестирования; они не являются доказательством сохранности сообщений, межпроцессной координации или production-ready надёжности.
  - Не обещай exactly-once доставку. Учитывай повторы, дедупликацию, идемпотентность и неопределённый результат HTTP-вызова при таймауте.
  - Не считай HTTP 4xx/5xx сетевой ошибкой автоматически: различай полученный HTTP-ответ и невозможность получить ответ.
  - Секреты храни во внешнем secret store; в базе допустимы ссылки и несекретные метаданные.

  Общие правила разработки:
  - Сохраняй обратную совместимость опубликованных Protobuf-контрактов или явно описывай миграцию и влияние на потребителей.
  - Предпочитай наблюдаемое поведение и контракты в спецификациях; технические детали реализации помещай в design.md и tasks.md, если они не являются частью внешнего контракта.
  - Учитывай авторизацию, SSRF, ограничения размера тела, безопасное логирование, аудит, таймауты и обработку ошибок там, где это относится к изменению.
  - Не объявляй тесты, сборку или проверки успешными, если они фактически не запускались.
  - Имена каталогов change должны включать дату в формате YYYY-MM-DD и краткое kebab-case описание, например 2026-10-29-add-inbound-routing.

rules:
  proposal:
    - Пиши на русском языке. Используй имя change в формате YYYY-MM-DD-kebab-case; дата должна соответствовать дате создания изменения.
    - Чётко описывай проблему, цель, объём работ, исключения из объёма, риски и проверяемые критерии успеха.
    - Не включай в предложение детали реализации, которые не нужны для объяснения решения; фиксируй важные архитектурные ограничения и совместимость.
  specs:
    - Пиши требования на русском языке и описывай наблюдаемое поведение системы.
    - Для каждого требования добавляй проверяемые сценарии с явными условиями, действием и ожидаемым результатом.
    - Отделяй поведение продукта от внутреннего способа реализации; технические механизмы указывай здесь только тогда, когда они являются частью обязательного контракта.
    - Для сообщений и API явно указывай обязательные поля, маршрутизацию, поведение при ошибках и требования обратной совместимости, когда это затронуто изменением.
  design:
    - Описывай затронутые вертикальные срезы, взаимодействия компонентов, границы транзакций, поток данных, ошибки, повторные попытки, безопасность и наблюдаемость по необходимости.
    - Для изменения Protobuf перечисляй затронутые .proto-контракты и оценивай совместимость с существующими потребителями.
    - Различай статические gRPC/REST API и динамические inbound HTTP endpoint-ы из OpenAPI.
    - Учитывай, что исходящий HTTP-вызов может завершиться неопределённым результатом при таймауте, и что повтор POST может привести к дублированию.
  tasks:
    - Разбивай работу на конкретные, проверяемые задачи, соответствующие вертикальным срезам; избегай расплывчатых задач вроде «реализовать всё».
    - Включай необходимые unit- и интеграционные тесты на TUnit; для EF Core-тестов используй SQLite in-memory с корректным временем жизни соединения.
    - Для изменений Protobuf добавляй задачи на обновление .proto, генерацию/сборку сгенерированного кода и проверку совместимости.
    - Не добавляй новые производственные проекты; весь production-код должен оставаться в LtiIntegrationGateway, тесты — в LtiIntegrationGateway.Tests.

operations:
  apply:
    guidance:
      - Перед изменением проверь существующую структуру и соглашения репозитория; следуй Feature-first и Vertical Slice Architecture.
      - Реализуй задачи по вертикальным срезам, не расширяй объём изменения без необходимости.
      - Считай .proto источником истины для gRPC и Rebus-контрактов; не редактируй сгенерированные файлы вручную.
      - Выполняй доступные сборку и целевые тесты. В итоговом отчёте указывай реально выполненные команды и результаты; отдельно отмечай непроверенные сценарии.
      - Не добавляй пакеты, проекты или инфраструктурные абстракции без обоснованной потребности.
  archive:
    guidance:
      - Перед архивированием проверь соответствие реализации задачам и спецификациям, а также актуальность постоянных specs.
      - Не утверждай, что проверки пройдены, если они не запускались или завершились ошибкой; зафиксируй оставшиеся ограничения.
      - Не удаляй незавершённые задачи и не скрывай известные отклонения от проектных решений.