schema: spec-driven

context: |
  Проект: LtiIntegrationGateway — самостоятельное приложение интеграции продуктов LTI с внешними системами.

  Источники истины (не дублируются в этом файле):
  - Актуальные функциональные и системные требования, наблюдаемое поведение и проверяемые сценарии:
    `openspec/specs/`. Перед созданием изменения изучай затрагиваемые постоянные Specs.
  - Архитектурные границы, принципы, технические ограничения, взаимодействия компонентов и фактическая
    организация кода: `ARCHITECTURE.md`. Следуй ему; не заводи параллельный журнал ADR.
  - Контракты gRPC/REST и сообщений Rebus: исходные `.proto` в `protos/`.
  - Обзор репозитория, команды сборки, запуска и настройки: `README.md`.
  - Правила работы агентов и обязательная документация `.proto`: `AGENTS.md`.
  - История изменений, исходные причины, варианты, проектирование и задачи: `openspec/changes/`
    и `openspec/changes/archive/`.

  Правила артефактов OpenSpec:
  - OpenSpec artifacts (proposal, specs, design, tasks) пишутся на русском языке.
  - Имена типов, методов, свойств, переменных, файлов исходного кода и технических идентификаторов
    сохраняются на английском языке.
  - Используй конкретные формулировки, проверяемые требования и однозначные критерии приёмки.
  - Не придумывай неизвестные бизнес-правила, внешние API, настройки эксплуатации или гарантии
    библиотек. Явно фиксируй открытые вопросы и допущения.
  - Не дублируй содержание постоянных Specs и архитектурные ограничения из `ARCHITECTURE.md`:
    ссылайся на соответствующие capability/spec и разделы архитектурного документа.
  - Не создавай ADR. Контекст, альтернативы и история конкретного изменения фиксируются в OpenSpec Change
    и сохраняются в OpenSpec Archive; актуальные требования — в постоянных Specs.
  - При миграции ранее созданных документов решений не удаляй исходник, пока каждое действующее требование
    не перенесено в постоянную Spec или `ARCHITECTURE.md`, а важный исторический контекст не сохранён в OpenSpec Archive.
  - Имена каталогов change должны включать дату в формате YYYY-MM-DD и краткое kebab-case описание,
    например 2026-11-01-add-inbound-routing; дата соответствует дате создания изменения.
  - Не объявляй тесты, сборку или проверки успешными, если они фактически не запускались.

rules:
  proposal:
    - Пиши на русском языке. Используй имя change в формате YYYY-MM-DD-kebab-case.
    - Чётко описывай проблему, цель, объём работ, исключения из объёма, риски и проверяемые критерии успеха.
    - Перед подготовкой proposal изучи затрагиваемые `openspec/specs/` и соответствующие разделы `ARCHITECTURE.md`.
    - Не копируй в proposal полные требования или архитектурные ограничения; указывай ссылки на соответствующие Specs и разделы архитектуры.
    - Явно указывай влияние на обратную совместимость, безопасность, надёжность и миграцию, если применимо.

  specs:
    - Пиши требования на русском языке и описывай наблюдаемое поведение системы.
    - Для каждого требования добавляй проверяемые сценарии с явными условиями, действием и ожидаемым результатом.
    - Отделяй поведение продукта от внутреннего способа реализации; технические механизмы указывай здесь
      только тогда, когда они являются частью обязательного контракта или системного требования.
    - Для сообщений и API явно указывай обязательные поля, маршрутизацию, поведение при ошибках и
      требования обратной совместимости, когда это затронуто изменением.
    - Не дублируй архитектурные принципы и технические ограничения из `ARCHITECTURE.md`; при необходимости
      ссылайся на соответствующий раздел.

  design:
    - Описывай затронутые вертикальные срезы, взаимодействия компонентов, границы транзакций, поток данных,
      ошибки, повторные попытки, безопасность и наблюдаемость по необходимости.
    - Указывай, как предлагаемое решение соответствует `ARCHITECTURE.md` и связанным постоянным Specs.
    - >-
      Отклонение от архитектурных ограничений фиксируй явно. Объясняй причину, последствия и требуемое обновление
      `ARCHITECTURE.md`; не оформляй такое отклонение отдельным ADR.
    - Для изменения Protobuf перечисляй затронутые `.proto`-контракты, правила совместимости и влияние
      на потребителей.

  tasks:
    - Разбивай работу на конкретные, проверяемые задачи, соответствующие вертикальным срезам; избегай
      расплывчатых задач вроде «реализовать всё».
    - Включай необходимые unit- и интеграционные тесты на TUnit с корректным временем жизни тестовых ресурсов.
    - Для изменений Protobuf добавляй задачи на обновление `.proto`, генерацию и проверку совместимости.
    - Добавляй задачу на обновление `ARCHITECTURE.md`, только если изменение затрагивает архитектуру
      или фактическую организацию решения.

operations:
  apply:
    guidance:
      - Перед изменением проверь существующую структуру и соглашения репозитория; следуй архитектурным
        принципам и ограничениям `ARCHITECTURE.md`, а требованиям — постоянным OpenSpec Specs.
      - Реализуй задачи по вертикальным срезам, не расширяй объём изменения без необходимости.
      - Выполняй доступные сборку и целевые тесты. В итоговом отчёте указывай реально выполненные команды
        и результаты; отдельно отмечай непроверенные сценарии.
      - Не добавляй пакеты, проекты или инфраструктурные абстракции без обоснованной потребности и
        проверки соответствия текущей архитектуре.
      - Не меняй опубликованные Protobuf-контракты несовместимым образом в пределах существующей версии.

  archive:
    guidance:
      - Перед архивированием проверь соответствие реализации задачам и постоянным Specs; актуализируй
        Specs, если фактическое изменение поведения требует этого.
      - Не утверждай, что проверки пройдены, если они не запускались или завершились ошибкой; зафиксируй
        оставшиеся ограничения.
      - Не удаляй незавершённые задачи и не скрывай известные отклонения от требований или архитектуры.
      - После архивации обнови `ARCHITECTURE.md`, если изменились фактические компоненты, структура,
        интеграционные потоки, транзакционные границы или архитектурные ограничения.
      - >-
        Не добавляй в `ARCHITECTURE.md` хронологию изменений. Контекст и история остаются в
        `openspec/changes/archive/`.
